<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluenta Korean - Vocabulary</title>
<link rel="icon" href="fluenta.png.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 10% 10%, rgba(237,76,141,0.14), transparent 25%),
        radial-gradient(circle at 90% 20%, rgba(180,60,255,0.10), transparent 25%),
        #090909;
    color: white;
    min-height: 100vh;
}

/* TOP BAR */

.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 5%;
    background: rgba(9,9,9,0.88);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 800;
}

.logo span {
    color: #ed4c8d;
}

.logo-dot {
    width: 11px;
    height: 11px;
    background: #ed4c8d;
    border-radius: 50%;
    box-shadow: 0 0 18px #ed4c8d;
}

/* CLOSE BUTTON */

.close-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #333;
    background: #151515;
    color: white;
    font-size: 21px;
    cursor: pointer;
    transition: 0.25s;
}

.close-btn:hover {
    background: #ed4c8d;
    border-color: #ed4c8d;
    transform: rotate(90deg);
}

/* HERO */

.hero {
    text-align: center;
    padding: 50px 20px 25px;
}

.hero-badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 30px;
    background: rgba(237,76,141,0.12);
    border: 1px solid rgba(237,76,141,0.3);
    color: #ff80b0;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 18px;
}

.hero h1 {
    font-size: clamp(38px, 7vw, 68px);
    line-height: 1;
    margin-bottom: 15px;
    letter-spacing: -2px;
}

.hero h1 span {
    color: #ed4c8d;
}

.hero p {
    color: #aaa;
    font-size: 16px;
    max-width: 600px;
    margin: auto;
    line-height: 1.6;
}

/* STATS */

.stats {
    width: 90%;
    max-width: 900px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

.stat {
    background: linear-gradient(145deg, #171717, #101010);
    border: 1px solid #292929;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.stat::before {
    content: "";
    position: absolute;
    width: 70px;
    height: 70px;
    background: rgba(237,76,141,0.15);
    border-radius: 50%;
    filter: blur(20px);
    top: -30px;
    right: -20px;
}

.stat-number {
    font-size: 27px;
    font-weight: 800;
    color: #fff;
}

.stat-label {
    color: #888;
    font-size: 12px;
    margin-top: 5px;
}

/* SEARCH */

.search-area {
    width: 90%;
    max-width: 1000px;
    margin: 30px auto 20px;
}

.search {
    width: 100%;
    padding: 17px 20px;
    background: #141414;
    border: 1px solid #292929;
    border-radius: 16px;
    color: white;
    font-size: 15px;
    outline: none;
    transition: 0.25s;
}

.search:focus {
    border-color: #ed4c8d;
    box-shadow: 0 0 20px rgba(237,76,141,0.12);
}

.search::placeholder {
    color: #666;
}

/* CATEGORY BUTTONS */

.categories {
    width: 90%;
    max-width: 1000px;
    margin: 15px auto 30px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.categories::-webkit-scrollbar {
    height: 3px;
}

.categories::-webkit-scrollbar-thumb {
    background: #ed4c8d;
    border-radius: 10px;
}

.category {
    flex-shrink: 0;
    border: 1px solid #292929;
    background: #141414;
    color: #aaa;
    padding: 10px 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.25s;
}

.category:hover,
.category.active {
    background: #ed4c8d;
    color: white;
    border-color: #ed4c8d;
}

/* SECTION */

.section-title {
    width: 90%;
    max-width: 1000px;
    margin: 35px auto 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.section-title h2 {
    font-size: 22px;
}

.section-title span {
    color: #777;
    font-size: 13px;
}

/* WORD GRID */

.word-grid {
    width: 90%;
    max-width: 1000px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding-bottom: 60px;
}

/* WORD CARD */

.word-card {
    background:
        linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)),
        #111;
    border: 1px solid #282828;
    border-radius: 22px;
    padding: 21px;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
    animation: cardIn 0.5s ease both;
}

.word-card::after {
    content: "";
    position: absolute;
    width: 90px;
    height: 90px;
    background: rgba(237,76,141,0.09);
    border-radius: 50%;
    right: -35px;
    bottom: -35px;
    filter: blur(4px);
}

.word-card:hover {
    transform: translateY(-5px);
    border-color: rgba(237,76,141,0.6);
    box-shadow: 0 12px 35px rgba(0,0,0,0.4);
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.word-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.korean {
    font-size: 29px;
    font-weight: 800;
}

.english {
    color: #aaa;
    margin-top: 7px;
    font-size: 14px;
}

.romanization {
    color: #ed4c8d;
    font-size: 12px;
    margin-top: 4px;
}

.voice {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #333;
    background: #1a1a1a;
    color: white;
    cursor: pointer;
    font-size: 17px;
    transition: 0.2s;
    position: relative;
    z-index: 2;
}

.voice:hover {
    background: #ed4c8d;
    border-color: #ed4c8d;
    transform: scale(1.08);
}

.voice:active {
    transform: scale(0.92);
}

.tag {
    display: inline-block;
    margin-top: 17px;
    padding: 5px 9px;
    border-radius: 8px;
    background: #1c1c1c;
    color: #777;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* EMPTY */

.empty {
    display: none;
    text-align: center;
    color: #777;
    padding: 50px;
    grid-column: 1/-1;
}

/* FOOTER */

.footer {
    text-align: center;
    color: #555;
    padding: 25px;
    font-size: 12px;
}

/* RESPONSIVE */

@media(max-width: 800px) {
    .word-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 550px) {
    .stats {
        grid-template-columns: 1fr;
    }

    .word-grid {
        grid-template-columns: 1fr;
    }

    .hero {
        padding-top: 35px;
    }

    .hero h1 {
        font-size: 43px;
    }
}
</style>
</head>

/* ================================
   DISPLAY WORDS
================================ */

const grid = document.getElementById("wordGrid");
const count = document.getElementById("count");
const search = document.getElementById("search");

let currentCategory = "all";


function renderWords(list) {

    grid.innerHTML = "";

    if (list.length === 0) {
        grid.innerHTML = `
            <div class="empty" style="display:block;">
                No words found 😭
            </div>
        `;
        count.textContent = "0 words";
        return;
    }

    list.forEach((word, index) => {

        const card = document.createElement("div");

        card.className = "word-card";

        card.style.animationDelay = `${index * 0.025}s`;

        card.innerHTML = `

            <div class="word-top">

                <div>
                    <div class="korean">${word.ko}</div>

                    <div class="english">
                        ${word.en}
                    </div>

                    <div class="romanization">
                        ${word.ro}
                    </div>
                </div>

                <button
                    class="voice"
                    onclick="speak('${word.ko.replace(/'/g,"\\'")}')"
                    title="Listen"
                >
                    🔊
                </button>

            </div>

            <div class="tag">
                ${word.cat}
            </div>

        `;

        grid.appendChild(card);
    });

    count.textContent = `${list.length} words`;
}


/* ================================
   VOICE
================================ */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        alert("Voice is not supported in this browser.");
        return;
    }

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(text);

    voice.lang = "ko-KR";
    voice.rate = 0.78;
    voice.pitch = 1;

    speechSynthesis.speak(voice);
}


/* ================================
   CATEGORY FILTER
================================ */

function filterCategory(category, button) {

    currentCategory = category;

    document.querySelectorAll(".category").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    search.value = "";

    if (category === "all") {
        renderWords(words);
    } else {
        renderWords(
            words.filter(word => word.cat === category)
        );
    }
}


/* ================================
   SEARCH
================================ */

function searchWords() {

    const query = search.value.toLowerCase().trim();

    let result = words;

    if (currentCategory !== "all") {
        result = result.filter(
            word => word.cat === currentCategory
        );
    }

    if (query !== "") {

        result = result.filter(word =>
            word.ko.includes(query) ||
            word.en.toLowerCase().includes(query) ||
            word.ro.toLowerCase().includes(query)
        );
    }

    renderWords(result);
}


/* ================================
   HOME BUTTON
================================ */

function goHome() {

    window.location.href = "index.html";

}


/* ================================
   START
================================ */

renderWords(words);
