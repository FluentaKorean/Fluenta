<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fluenta Streak</title>

<style>
body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 50px;
    color: #ff4fa3;
    font-size: 40px;
}

.streak-box {
    margin: 40px auto;
    width: 220px;
    padding: 25px;
    background: #171717;
    border-radius: 20px;
    border: 2px solid #ff4fa3;
}

.streak-box img {
    width: 120px;
    height: 120px;
    object-fit: contain;
}

.streak-box span {
    display: block;
    margin-top: 15px;
    font-size: 25px;
    font-weight: bold;
}
</style>

</head>

<body>

<h1>My Streak</h1>

<div class="streak-box">
    <img id="streakImage" src="streakday1.png" alt="Streak">
    <span id="streakText">1 day</span>
</div>

<script>
let today = new Date();
let todayDate = today.toDateString();

let lastVisit = localStorage.getItem("lastVisit");
let streak = Number(localStorage.getItem("streak")) || 1;

if (lastVisit !== todayDate) {

    if (lastVisit) {
        let lastDate = new Date(lastVisit);

        let todayStart = new Date(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
        );

        let lastStart = new Date(
            lastDate.getFullYear(),
            lastDate.getMonth(),
            lastDate.getDate()
        );

        let difference =
            Math.round((todayStart - lastStart) / (1000 * 60 * 60 * 24));

        if (difference === 1) {
            streak++;
        } else if (difference > 1) {
            streak = 1;
        }
    }

    localStorage.setItem("streak", streak);
    localStorage.setItem("lastVisit", todayDate);
}

document.getElementById("streakText").textContent =
    streak + (streak === 1 ? " day" : " days");

document.getElementById("streakImage").src =
    "streakday" + Math.min(streak, 7) + ".png";
</script>


</body>
</html>
