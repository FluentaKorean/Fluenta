<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fluenta Streak</title>

<style>

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 50px;
    color: #ff4fa3;
    font-size: 40px;
}

.streak-box {
    margin: 40px auto;
    width: 220px;
    padding: 25px;
    background: #171717;
    border-radius: 20px;
    border: 2px solid #ff4fa3;
}


/* MOVING AREA */

.streak-image-container {
    width: 120px;
    height: 120px;
    margin: 0 auto;

    animation: streakFloat 3s ease-in-out infinite;
}


/* THE STREAK IMAGE */

.streak-image-container img {
    width: 120px;
    height: 120px;
    object-fit: contain;
}


/* AUTOMATIC FLOATING */

@keyframes streakFloat {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }

    100% {
        transform: translateY(0);
    }

}


/* TEXT */

.streak-box span {
    display: block;
    margin-top: 15px;
    font-size: 25px;
    font-weight: bold;
}

</style>

</head>

<body>

<h1>My Streak</h1>


<div class="streak-box">

    <div class="streak-image-container">

        <img id="streakImage" src="" alt="Streak">

    </div>

    <span id="streakText"></span>

</div>


<script>

/* GET TODAY'S DATE */

function getDateKey(date) {

    return date.getFullYear() + "-" +
           String(date.getMonth() + 1).padStart(2, "0") + "-" +
           String(date.getDate()).padStart(2, "0");

}


let today = new Date();

let todayKey = getDateKey(today);

let lastVisit = localStorage.getItem("lastVisit");

let streak = Number(localStorage.getItem("streak")) || 0;


/* FIRST VISIT */

if (!lastVisit) {

    streak = 1;

}


/* CHECK FOR A NEW DAY */

else if (lastVisit !== todayKey) {

    let lastDate = new Date(lastVisit + "T00:00:00");

    let todayStart = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    );

    let lastStart = new Date(
        lastDate.getFullYear(),
        lastDate.getMonth(),
        lastDate.getDate()
    );


    let difference = Math.round(
        (todayStart - lastStart) /
        (1000 * 60 * 60 * 24)
    );


    /* VISITED THE NEXT DAY */

    if (difference === 1) {

        streak++;

    }


    /* MISSED A DAY */

    else if (difference > 1) {

        streak = 1;

    }

}


/* SAVE TODAY'S VISIT */

localStorage.setItem("streak", streak);

localStorage.setItem("lastVisit", todayKey);


/* DISPLAY STREAK NUMBER */

document.getElementById("streakText").textContent =
    streak + (streak === 1 ? " day" : " days");


/* DISPLAY CORRECT DAY IMAGE */

let dayNumber = Math.min(streak, 7);

document.getElementById("streakImage").src =
    "streakday" + dayNumber + ".png";

</script>

</body>
</html>
