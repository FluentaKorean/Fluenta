<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111e22">
<title>Fluenta Korean — Lesson Path</title>

<style>
:root {
  --bg:#111e22;
  --white:#f8fbff;
}

* { box-sizing:border-box; }

html {
  scroll-behavior:smooth;
  scroll-padding-top:105px;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,a {
  -webkit-tap-highlight-color:transparent;
}

.topbar {
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(17,30,34,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #26383e;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}

.topline {
  max-width:650px;
  margin:0 auto 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand {
  font-weight:900;
  font-size:15px;
  color:white;
}

.menu-toggle {
  width:42px;
  height:38px;
  border:1px solid #35474e;
  border-radius:10px;
  background:#1b2b30;
  color:white;
  display:grid;
  place-items:center;
  cursor:pointer;
}

.menu-toggle svg {
  width:23px;
  height:23px;
}

.stats {
  max-width:650px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.stat {
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:800;
  font-size:13px;
  white-space:nowrap;
}

.stat .flag { font-size:19px; }
.stat svg { width:20px;height:20px;flex-shrink:0; }
.stat.streak { color:#ff8b43; }
.stat.gems { color:#35c6ff; }
.stat.energy { color:#ff69b7; }

.page {
  max-width:650px;
  margin:0 auto;
  padding:20px 16px 125px;
}

.session {
  margin:0 0 20px;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 5px 0 var(--shadow);
  background:var(--accent);
}

.session-head {
  display:flex;
  align-items:stretch;
  min-height:83px;
}

.session-title {
  flex:1;
  padding:15px 17px;
}

.session-kicker {
  font-size:12px;
  font-weight:900;
  letter-spacing:.7px;
  opacity:.85;
  text-transform:uppercase;
}

.session-name {
  font-size:20px;
  line-height:1.2;
  font-weight:850;
  margin-top:6px;
}

.session-list {
  width:57px;
  border-left:2px solid #0002;
  display:grid;
  place-items:center;
  background:#0000000b;
}

.session-list svg {
  width:26px;
  height:26px;
}

.path {
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:5px 0 24px;
  min-height:300px;
}

.path:before {
  content:"";
  position:absolute;
  top:10px;
  bottom:25px;
  left:50%;
  width:5px;
  border-radius:20px;
  background:repeating-linear-gradient(
    to bottom,
    #ffffff15 0 12px,
    transparent 12px 22px
  );
  transform:translateX(-50%);
}

.stop {
  position:relative;
  width:100%;
  height:101px;
  display:flex;
  align-items:center;
  z-index:1;
}

.stop.left {
  justify-content:flex-start;
  padding-left:calc(50% - 145px);
}

.stop.center {
  justify-content:center;
}

.stop.right {
  justify-content:flex-end;
  padding-right:calc(50% - 145px);
}

.bubble {
  width:76px;
  height:76px;
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center;
  color:white;
  text-decoration:none;
  font-size:27px;
  font-weight:950;
  background:var(--bubble);
  border:3px solid #ffffff35;
  box-shadow:
    0 7px 0 var(--bubble-shadow),
    inset 0 4px 0 #ffffff35,
    inset 0 -5px 0 #00000013;
  transition:transform .12s;
  cursor:pointer;
  flex-shrink:0;
}

.bubble:before {
  content:"";
  position:absolute;
  width:30px;
  height:12px;
  top:10px;
  left:12px;
  border-radius:50%;
  background:#ffffff30;
  transform:rotate(-25deg);
}

.bubble:active {
  transform:translateY(4px);
}

.bubble .number {
  position:relative;
  z-index:1;
  text-shadow:0 1px 1px #0002;
}

.side-art {
  width:80px;
  height:78px;
  position:absolute;
  top:10px;
  display:grid;
  place-items:center;
}

.side-art.left-art {
  left:calc(50% - 205px);
}

.side-art.right-art {
  right:calc(50% - 205px);
}

.stars {
  position:absolute;
  top:77px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:3px;
  color:#40535b;
}

.stars svg {
  width:17px;
  height:17px;
  fill:currentColor;
}

.chest {
  width:65px;
  height:62px;
  filter:drop-shadow(0 4px 0 #0005);
}

.mascot {
  width:65px;
  height:74px;
  position:relative;
}

.mascot .hair {
  position:absolute;
  left:15px;
  top:2px;
  width:38px;
  height:34px;
  border-radius:48% 48% 35% 35%;
  background:var(--hair);
}

.mascot .face {
  position:absolute;
  left:19px;
  top:17px;
  width:30px;
  height:27px;
  border-radius:45%;
  background:#ffc5ad;
  z-index:2;
}

.mascot .eye {
  position:absolute;
  top:10px;
  width:4px;
  height:5px;
  background:#25343a;
  border-radius:50%;
}

.mascot .eye.one { left:7px; }
.mascot .eye.two { right:7px; }

.mascot .smile {
  position:absolute;
  left:12px;
  top:18px;
  width:7px;
  height:4px;
  border-bottom:2px solid #b75d68;
  border-radius:50%;
}

.mascot .body {
  position:absolute;
  left:15px;
  top:43px;
  width:38px;
  height:26px;
  border-radius:12px 12px 8px 8px;
  background:var(--shirt);
  z-index:3;
}

.mascot .leg {
  position:absolute;
  top:62px;
  width:9px;
  height:12px;
  background:#514b68;
  border-radius:5px;
  z-index:2;
}

.mascot .leg.one { left:23px; }
.mascot .leg.two { right:19px; }

.mascot .arm {
  position:absolute;
  top:47px;
  width:9px;
  height:23px;
  background:#ffc5ad;
  border-radius:8px;
  z-index:2;
}

.mascot .arm.one {
  left:8px;
  transform:rotate(15deg);
}

.mascot .arm.two {
  right:7px;
  transform:rotate(-18deg);
}

.end-mark {
  color:#a5b8c1;
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  margin:8px 0 20px;
  text-align:center;
}

/* Hamburger menu */

.menu-backdrop {
  position:fixed;
  inset:0;
  background:#0009;
  z-index:49;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

.side-menu {
  position:fixed;
  z-index:50;
  top:0;
  bottom:0;
  left:0;
  width:min(300px,84vw);
  padding:calc(20px + env(safe-area-inset-top)) 18px 24px;
  background:#17262b;
  border-right:1px solid #34454c;
  transform:translateX(-105%);
  transition:transform .23s ease;
  overflow-y:auto;
}

body.menu-open .menu-backdrop {
  opacity:1;
  pointer-events:auto;
}

body.menu-open .side-menu {
  transform:translateX(0);
}

.menu-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.menu-brand {
  font-size:23px;
  font-weight:900;
  color:#ff65b3;
}

.menu-close {
  background:transparent;
  border:0;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.menu-link {
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 12px;
  margin:5px 0;
  border-radius:10px;
  color:#f8fbff;
  text-decoration:none;
  font-weight:700;
}

.menu-link:hover {
  background:#263b43;
}

.menu-dot {
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ff65b3;
}

/* Bottom navigation */

.bottom-nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  background:rgba(17,30,34,.98);
  border-top:2px solid #2b3b41;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:center;
  gap:clamp(12px,5vw,42px);
}

.nav-item {
  width:48px;
  height:46px;
  border:0;
  background:transparent;
  color:#91a7b0;
  display:grid;
  place-items:center;
  border-radius:12px;
  text-decoration:none;
}

.nav-item svg {
  width:27px;
  height:27px;
  stroke:currentColor;
  stroke-width:2.5;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav-item.active {
  color:#ffd447;
  background:#263b43;
  outline:2px solid #2a839f;
}

.nav-item:nth-child(2) { color:#ffbd35; }
.nav-item:nth-child(3) { color:#ff4d62; }
.nav-item:nth-child(4) { color:#ff79c6; }
.nav-item:nth-child(5) { color:#38d9bb; }
.nav-item:nth-child(6) { color:#d778ff; }

@media(max-width:390px) {
  .page {
    padding-left:10px;
    padding-right:10px;
  }

  .stop.left {
    padding-left:calc(50% - 118px);
  }

  .stop.right {
    padding-right:calc(50% - 118px);
  }

  .side-art.left-art {
    left:calc(50% - 165px);
  }

  .side-art.right-art {
    right:calc(50% - 165px);
  }

  .bubble {
    width:68px;
    height:68px;
    font-size:24px;
  }

  .session-name { font-size:18px; }
  .session-title { padding-left:13px; }

  .bottom-nav {
    gap:clamp(8px,3vw,18px);
  }

  .nav-item { width:42px; }
}

@media(min-width:600px) {
  .page { padding-top:24px; }
  .stop { height:112px; }
  .bubble { width:82px;height:82px; }
}
</style>
</head>

<body>

    <button class="menu-toggle" id="menuToggle"

      <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.4"

<script>

const sessions = [
  {start:1,end:10,title:"Order at a Cafe"},
  {start:11,end:20,title:"Talk about yourself"},
  {start:21,end:30,title:"Meet new people"},
  {start:31,end:40,title:"Food and daily life"},
  {start:41,end:50,title:"Places and directions"},
  {start:51,end:60,title:"Your everyday routine"},
  {start:61,end:70,title:"Shopping and money"},
  {start:71,end:80,title:"Plans and invitations"},
  {start:81,end:90,title:"Past experiences"},
  {start:91,end:100,title:"Keep the conversation going"}
];

const colors = [
  ["#ff4657","#c91f3c"],
  ["#ff8a2b","#d85c13"],
  ["#ffd43b","#d39b08"],
  ["#42d878","#17964c"],
  ["#20b8ff","#087db9"],
  ["#626bff","#3941c4"],
  ["#ad62ff","#7835c9"],
  ["#ff55b6","#c92b7f"],
  ["#e8b23b","#a97912"],
  ["#27d6c2","#138e82"],
  ["#ff6b83","#c83956"],
  ["#8bd34d","#508b21"]
];

const path = document.getElementById("lessonPath");

const starSvg = `
<svg viewBox="0 0 24 24">
<path d="m12 2.5 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/>
</svg>`;

const listSvg = `
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2.4"
stroke-linecap="round">
<path d="M9 5h11M9 12h11M9 19h11"/>
<circle cx="4" cy="5" r="1" fill="currentColor"/>
<circle cx="4" cy="12" r="1" fill="currentColor"/>
<circle cx="4" cy="19" r="1" fill="currentColor"/>
</svg>`;

const chestSvg = `
<svg class="chest" viewBox="0 0 70 66">
<path d="M9 22V12q0-5 5-5h42q5 0 5 5v10" fill="#ffcf9b"/>
<path d="M7 21h56v37H7z" fill="#bd760d"/>
<path d="M13 27h44v23H13z" fill="#80440d" stroke="#ffcf9b" stroke-width="4"/>
<path d="M7 22h56v9H7z" fill="#ffb83e"/>
<circle cx="35" cy="30" r="4" fill="#fff7e9"/>
<path d="M12 56h46" stroke="#ffd09b" stroke-width="5"/>
</svg>`;

function mascot(colorIndex) {

  const hair = [
    "#44283f","#ff922e","#563d91",
    "#dc4b72","#2c7b9a","#523b83"
  ][colorIndex % 6];

  const shirt = [
    "#ff5aa8","#23b8ff","#ff4d5a",
    "#f3bd32","#47d47a","#a86aff"
  ][colorIndex % 6];

  return `
  <div class="mascot" style="--hair:${hair};--shirt:${shirt}">
    <div class="hair"></div>
    <div class="face">
      <i class="eye one"></i>
      <i class="eye two"></i>
      <i class="smile"></i>
    </div>
    <div class="arm one"></div>
    <div class="arm two"></div>
    <div class="body"></div>
    <div class="leg one"></div>
    <div class="leg two"></div>
  </div>`;
}

function addSession(session,index) {

  const [accent,shadow] = colors[index % colors.length];

  const section = document.createElement("section");

  section.className = "lesson-session";
  section.id = "session-" + (index + 1);

  section.style.setProperty("--accent",accent);
  section.style.setProperty("--shadow",shadow);

  section.innerHTML = `
    <div class="session">
      <div class="session-head">

        <div class="session-title">
          <div class="session-kicker">
            Section ${Math.floor(index/3)+1}, Unit ${index+1}
          </div>

          <div class="session-name">
            ${session.title}
          </div>
        </div>

        <div class="session-list">
          ${listSvg}
        </div>

      </div>
    </div>

    <div class="path"></div>
  `;

  const pathEl = section.querySelector(".path");

  for(let n=session.start; n<=session.end; n++) {

    const local = n-session.start;

    const stop = document.createElement("div");

    stop.className = "stop " +
      ["center","right","right","center","left",
       "left","center","right","right","center"][local % 10];

    /* All lessons in this section use the same colour */
    const color = colors[index % colors.length];

    stop.style.setProperty("--bubble",color[0]);
    stop.style.setProperty("--bubble-shadow",color[1]);

    if(local === 3 || local === 7) {

      const art = document.createElement("div");

      art.className = "side-art " +
        (local === 3 ? "left-art" : "right-art");

      art.innerHTML = mascot(index+local);

      stop.appendChild(art);
    }

    const a = document.createElement("a");

    a.className = "bubble";

    /* Clicking lesson 1 opens lesson-1.html */
    a.href = `lesson-${n}.html`;

    a.setAttribute("aria-label",`Open lesson ${n}`);
    a.title = `Lesson ${n}`;

    a.innerHTML = `<span class="number">${n}</span>`;

    stop.appendChild(a);

    if(local === 4 || local === 9) {

      const stars = document.createElement("div");

      stars.className = "stars";
      stars.innerHTML = starSvg + starSvg + starSvg;

      a.appendChild(stars);
    }

    pathEl.appendChild(stop);

    if(local === 5) {

      const chestStop = document.createElement("div");

      chestStop.className = "stop center";
      chestStop.innerHTML = chestSvg;

      pathEl.appendChild(chestStop);
    }
  }

  const end = document.createElement("div");

  end.className = "end-mark";
  end.textContent = "• • •";

  pathEl.appendChild(end);

  path.appendChild(section);
}

sessions.forEach(addSession);


/* Korean flag counter: 1, 2, 3, etc. */

const counter = document.getElementById("sectionCounter");

const sessionSections = [
  ...document.querySelectorAll(".lesson-session")
];

if("IntersectionObserver" in window) {

  const sessionObserver = new IntersectionObserver(entries => {

    const visible = entries
      .filter(entry => entry.isIntersecting)
      .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];

    if(visible) {

      const currentIndex =
        sessionSections.indexOf(visible.target);

      if(currentIndex >= 0) {
        counter.textContent = String(currentIndex + 1);
      }
    }

  }, {
    rootMargin:"-18% 0px -55% 0px",
    threshold:[0,.1,.25,.5]
  });

  sessionSections.forEach(section =>
    sessionObserver.observe(section)
  );
}


/* Hamburger menu */

const menuToggle = document.getElementById("menuToggle");
const menuClose = document.getElementById("menuClose");
const menuBackdrop = document.getElementById("menuBackdrop");
const sideMenu = document.getElementById("sideMenu");

function setMenuOpen(open) {

  document.body.classList.toggle("menu-open",open);

  menuToggle.setAttribute(
    "aria-expanded",
    String(open)
  );

  sideMenu.setAttribute(
    "aria-hidden",
    String(!open)
  );
}

menuToggle.addEventListener("click",() =>
  setMenuOpen(true)
);

menuClose.addEventListener("click",() =>
  setMenuOpen(false)
);

menuBackdrop.addEventListener("click",() =>
  setMenuOpen(false)
);

document.addEventListener("keydown",event => {

  if(event.key === "Escape") {
    setMenuOpen(false);
  }

});

</script>

</body>
</html>
